[package]
name = "maipai-stack-desktop"
version = "0.1.0"
description = "MaiPai Stack desktop shell"
authors = ["MaiPai"]
edition = "2021"

[build-dependencies]
tauri-build = "=2.4.1"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tauri = { version = "=2.8.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.0"
tauri-plugin-dialog = "=2.4.0"
tauri-plugin-notification = "=2.3.0"
tauri-plugin-shell = "=2.3.3"
tauri-plugin-single-instance = "=2.3.3"
tauri-plugin-window-state = "=2.4.1"
ureq = "=2.12.1"
