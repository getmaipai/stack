<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MaiPai Stack admin (mockup)</title>
<meta name="theme-color" content="#0b0c10">
<style>
:root{
  --bg:#0b0c10; --bg2:#12141a; --card:#171a21; --card2:#1d212a; --line:rgba(255,255,255,.08);
  --text:#f2f4f8; --muted:#9aa3b2; --faint:#6b7382;
  --accent:#7c8cff; --accent-ink:#0b0c10; --accent-soft:rgba(124,140,255,.16);
  --ok:#3ecf8e; --warn:#f5b84b; --bad:#ff6b6b;
  --glass:rgba(18,20,26,.72);
  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px;
  --spring:cubic-bezier(.34,1.4,.5,1); --ease:cubic-bezier(.2,.8,.2,1);
  --c-chat:#7c8cff; --c-embed:#b48cff; --c-stt:#4cc3e8; --c-tts:#ff8fb8; --c-wake:#8aa0b8; --c-image:#e8a86a;
  --c-other:#3a4050; --c-free:rgba(255,255,255,.05);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Geist","Segoe UI",system-ui,Roboto,sans-serif;
  --shadow:0 20px 60px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --bg:#f4f5f8; --bg2:#ffffff; --card:#ffffff; --card2:#f0f2f6; --line:rgba(10,15,30,.09);
  --text:#12141a; --muted:#566074; --faint:#8791a3;
  --accent:#4a5cf0; --accent-ink:#fff; --accent-soft:rgba(74,92,240,.12);
  --ok:#14a36b; --warn:#c98a12; --bad:#d9433f;
  --glass:rgba(255,255,255,.72);
  --c-chat:#4a5cf0; --c-embed:#8a55e0; --c-stt:#1a9cc4; --c-tts:#e0558c; --c-wake:#667a92; --c-image:#cc7f2f;
  --c-other:#c9cfdb; --c-free:rgba(10,15,30,.05);
  --shadow:0 20px 50px rgba(20,30,60,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
b,strong,h1,h2,h3,.w6{font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* motion */
@media (prefers-reduced-motion:no-preference){
  .press{transition:transform .35s var(--spring),background .2s var(--ease),box-shadow .3s var(--ease)}
  .press:active{transform:scale(.97)}
  .card.tap:hover{transform:translateY(-2px)}
  .view{animation:rise .5s var(--spring)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* sign in */
#signin{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:
  radial-gradient(900px 500px at 20% -10%,var(--accent-soft),transparent 60%),var(--bg);z-index:100}
.signbox{width:100%;max-width:360px;text-align:center}
.logo{width:64px;height:64px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto 22px;font-size:28px;font-weight:600}
.signbox h1{font-size:28px;letter-spacing:-.02em;margin-bottom:6px}
.field{width:100%;padding:15px 18px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);outline:none;margin-top:22px;text-align:center}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.btn{padding:12px 20px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.wide{width:100%;margin-top:14px;padding:15px}

/* shell */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
#rail{position:sticky;top:0;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--bg2)}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 22px;font-weight:600;font-size:17px}
.brand .logo{width:34px;height:34px;border-radius:11px;font-size:16px;margin:0}
.navitem{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-sm);color:var(--muted);text-align:left;width:100%}
.navitem svg{width:20px;height:20px;flex:none}
.navitem:hover{background:var(--card2);color:var(--text)}
.navitem.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.kbd{margin-left:auto;font-size:12px;color:var(--faint);border:1px solid var(--line);border-radius:7px;padding:1px 7px}
main{min-width:0;padding:28px 36px 140px;max-width:1180px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.top h1{font-size:30px;letter-spacing:-.025em;line-height:1.1}
.top .sp{flex:1}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.iconbtn svg{width:19px;height:19px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:var(--card2);font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.dot.idle{background:var(--faint);box-shadow:none}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}
.dot.bad{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 22%,transparent)}

/* tab bar */
#tabbar{display:none}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card.tap{cursor:pointer;text-align:left;width:100%;display:block}
.hero{padding:28px;border-radius:var(--r-xl);background:linear-gradient(135deg,var(--accent-soft),transparent 70%),var(--card);border:1px solid var(--line);margin-bottom:22px}
.hero h2{font-size:34px;letter-spacing:-.03em;line-height:1.1;margin:10px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.rolehead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rolehead .name{font-weight:600;font-size:16px}
.rolehead .st{margin-left:auto;font-size:13px;color:var(--muted)}
.big{font-size:30px;letter-spacing:-.02em;font-weight:600}
.big small{font-size:14px;font-weight:400;color:var(--muted);margin-left:3px}
.sub{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{width:100%;height:34px;margin-top:12px;display:block}
.section{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:30px 4px 12px}

/* now bar */
#nowbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;width:min(720px,calc(100% - 32px));z-index:30;
  display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:22px;background:var(--glass);
  backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer}
#nowbar .eq{display:flex;gap:3px;align-items:flex-end;height:20px}
#nowbar .eq i{width:3px;background:var(--accent);border-radius:2px;height:6px;animation:eq 1.1s ease-in-out infinite}
#nowbar .eq i:nth-child(2){animation-delay:.2s}#nowbar .eq i:nth-child(3){animation-delay:.4s}#nowbar .eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:5px}50%{height:19px}}
#nowbar .txt{min-width:0;flex:1}
#nowbar .txt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.press-badge{padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.press-badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.press-badge.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);z-index:60}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;z-index:61;background:var(--glass);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);
  border:1px solid var(--line);box-shadow:var(--shadow);padding:10px 22px 28px;overflow:auto;
  left:0;right:0;bottom:0;max-height:86vh;border-radius:var(--r-xl) var(--r-xl) 0 0;transform:translateY(105%);transition:transform .5s var(--spring)}
#sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--faint);opacity:.5;margin:4px auto 16px}
.kv{display:grid;grid-template-columns:1fr auto;gap:0;margin:14px 0}
.kv div{padding:11px 0;border-bottom:1px solid var(--line)}
.kv div:nth-child(odd){color:var(--muted)}
.kv div:nth-child(even){text-align:right}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* resources */
.bar{display:flex;height:44px;border-radius:14px;overflow:hidden;background:var(--c-free);gap:2px}
.bar i{display:block;height:100%;transition:width .8s var(--ease)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:4px;display:inline-block}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--card2);border:1px solid var(--line)}
.seg button{padding:6px 14px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px}
.chart{position:relative}
.chart h3{font-size:14px;color:var(--muted);font-weight:400;display:flex;justify-content:space-between;margin-bottom:8px}
.chart h3 b{color:var(--text)}
.chart svg{width:100%;height:150px;display:block;touch-action:none}
.tip{position:absolute;pointer-events:none;padding:8px 11px;border-radius:12px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);font-size:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .15s;white-space:nowrap;z-index:5}
.tip.on{opacity:1}
table{width:100%;border-collapse:collapse}
td,th{padding:13px 8px;text-align:right;border-bottom:1px solid var(--line);font-weight:400;font-size:14px}
th{color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
td:first-child,th:first-child{text-align:left}
.tblwrap{overflow-x:auto}
.swatch{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:9px}
.bar.thin{height:10px;border-radius:6px;margin-top:8px}

/* helper */
.chat{display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:420px}
.msgs{flex:1;overflow:auto;padding:6px 2px 14px;display:flex;flex-direction:column;gap:12px}
.bub{max-width:82%;padding:12px 16px;border-radius:20px;background:var(--card2);align-self:flex-start;animation:rise .4s var(--spring)}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.tool{align-self:flex-start;max-width:92%;width:420px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);padding:14px}
.tool .tag{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.diff{margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--bg);font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
.diff .a{color:var(--muted)}
.wake{align-self:flex-start;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:3px;animation:bob 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.composer{position:relative;display:flex;gap:10px;align-items:center;padding-top:8px}
.composer .field{margin:0;text-align:left;border-radius:999px}
.cmdmenu{position:absolute;bottom:62px;left:0;width:280px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:var(--r-md);padding:6px;box-shadow:var(--shadow)}
.cmdmenu button{display:flex;gap:12px;width:100%;padding:9px 12px;border-radius:10px;text-align:left}
.cmdmenu button:hover{background:var(--accent-soft)}
.cmdmenu span{color:var(--muted);font-size:13px}
.meter{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.meter .bar{width:90px;height:6px;border-radius:4px}
.meter .bar i{background:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{padding:7px 13px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.chip:hover{color:var(--text)}

/* lists and settings */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:400;font-size:15px}
.li .d{font-size:13px;color:var(--muted)}
.tog{width:52px;height:32px;border-radius:999px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none;transition:background .3s var(--ease)}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--text);transition:transform .4s var(--spring)}
.tog.on{background:var(--accent)}
.tog.on::after{transform:translateX(20px);background:var(--accent-ink)}
.handle{color:var(--faint);cursor:grab;padding:4px;touch-action:none}
.li.drag{opacity:.4}
select.field,input.small{width:auto;margin:0;padding:9px 14px;text-align:left;border-radius:12px}
details.more{margin-top:18px}
details.more summary{cursor:pointer;color:var(--muted);padding:12px 4px;list-style:none}
details.more summary::before{content:"+  "}
details[open].more summary::before{content:"-  "}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .big{color:var(--text);margin-bottom:6px}
.fix{border-left:3px solid var(--warn)}

/* skeleton */
.sk{border-radius:var(--r-lg);background:linear-gradient(100deg,var(--card) 30%,var(--card2) 50%,var(--card) 70%);background-size:300% 100%;animation:sh 1.3s linear infinite;height:140px}
@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}

/* palette */
#pal{position:fixed;inset:0;z-index:90;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 0;background:rgba(0,0,0,.45)}
#pal .box{width:min(560px,100%);background:var(--glass);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;animation:rise .35s var(--spring)}
#pal input{width:100%;padding:18px 20px;background:none;border:0;border-bottom:1px solid var(--line);outline:none;font-size:17px}
#pal .res{max-height:50vh;overflow:auto;padding:8px}
#pal .res button{display:flex;width:100%;gap:12px;padding:11px 14px;border-radius:12px;text-align:left;align-items:center}
#pal .res button.sel{background:var(--accent-soft)}
#pal .res small{margin-left:auto;color:var(--faint)}
#toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-140%);padding:12px 20px;border-radius:999px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:var(--shadow);z-index:120;transition:transform .5s var(--spring)}
#toast.on{transform:translate(-50%,0)}

/* phone */
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  #rail{display:none}
  main{padding:20px 16px 170px}
  .top h1{font-size:26px}
  .hero{padding:22px}.hero h2{font-size:28px}
  #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;justify-content:space-around;padding:8px 6px calc(10px + env(safe-area-inset-bottom));
    background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border-top:1px solid var(--line)}
  #tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--faint);padding:4px 10px;flex:1}
  #tabbar button svg{width:23px;height:23px}
  #tabbar button.on{color:var(--accent)}
  #nowbar{bottom:calc(74px + env(safe-area-inset-bottom));width:calc(100% - 20px);padding:10px 14px}
  .chat{height:calc(100vh - 290px)}
  .bub{max-width:90%}
}
@media (min-width:861px){
  #sheet{left:auto;right:16px;top:16px;bottom:16px;width:420px;max-height:none;border-radius:var(--r-xl);transform:translateX(110%)}
  #sheet.on{transform:none}
  .grab{display:none}
}
</style>
</head>
<body>

<div id="signin">
  <form class="signbox" id="signform">
    <div class="logo">M</div>
    <h1>MaiPai Stack</h1>
    <p class="muted">Sign in to manage the engines on this computer.</p>
    <input class="field" id="pw" type="password" placeholder="Admin password" autocomplete="current-password" aria-label="Admin password">
    <button class="btn primary wide press" type="submit">Sign in</button>
    <p class="faint" style="margin-top:18px;font-size:13px">Mockup: any password works. Forgot it? Reset it with a command on this computer.</p>
  </form>
</div>

<div id="app" class="hidden">
  <nav id="rail" aria-label="Main"></nav>
  <main id="main"></main>
</div>
<nav id="tabbar" class="hidden" aria-label="Main"></nav>
<div id="nowbar" class="hidden" role="button" tabindex="0" aria-label="Open resources"></div>
<div id="scrim"></div>
<aside id="sheet" aria-modal="true" role="dialog"></aside>
<div id="pal" class="hidden"><div class="box"><input id="palin" placeholder="Jump to a screen or run an action" aria-label="Command palette"><div class="res" id="palres"></div></div></div>
<div id="toast" role="status"></div>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- icons ---------- */
var I={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>',
 chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.7 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg>',
 heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>',

function seed(rg){
  var n=60,s={};
  var i;
  function wave(base,amp,i,ph){return base+amp*Math.sin(i/(rg==='1h'?9:rg==='24h'?6:4)+ph)+rnd(-amp*.25,amp*.25)}
  roles.forEach(function(r,ri){s[r.id]=[];for(var i=0;i<n;i++){var b=r.id==='image'?(i%17>13?7.2:0):r.base;s[r.id].push(Math.max(0,r.id==='image'?b:wave(b,b*.03,i,ri)))}});
  s.swap=[];s.cpu=[];s.gpu=[];s.tps=[];
  for(i=0;i<n;i++){s.swap.push(Math.max(0,wave(.3,.12,i,1)));s.cpu.push(Math.max(2,wave(24,12,i,2)));s.gpu.push(Math.max(2,wave(40,25,i,3)));s.tps.push(Math.max(0,wave(30,16,i,4)))}
  return s;
}

function drawChart(el,spec){
  /* spec: {title,unit,series:[{name,color,data}],stacked,max,fixedMax} */
  var W=600,H=150,n=spec.series[0].data.length;
  var base=new Array(n).fill(0),paths='',tops=[];
  var mx=spec.max||1;
  if(spec.stacked){mx=0;for(var i=0;i<n;i++){var t=0;spec.series.forEach(function(s){t+=s.data[i]});mx=Math.max(mx,t)}}
  else{mx=Math.max.apply(0,spec.series[0].data)*1.15}
  mx=spec.fixedMax||mx||1;
  spec.series.forEach(function(s,si){
    var top=[],bot=[];
    for(var i=0;i<n;i++){var x=i/(n-1)*W;var b=spec.stacked?base[i]:0;var v=b+s.data[i];
      top.push([x,H-(v/mx)*(H-8)-2]);bot.push([x,H-(b/mx)*(H-8)-2]);if(spec.stacked)base[i]=v}
    var d='M'+top.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' L');
    if(spec.stacked){paths+='<path d="'+d+' L'+bot.reverse().map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' L')+'Z" fill="'+s.color+'" opacity=".85"/>'}
    else{paths+='<path d="'+d+' L'+W+' '+H+' L0 '+H+'Z" fill="'+s.color+'" opacity=".14"/><path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'}
  });
  var grid='<g stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"><path d="M0 '+(H*.25)+'H'+W+' M0 '+(H*.5)+'H'+W+' M0 '+(H*.75)+'H'+W+'"/></g>';
  var last=0;spec.series.forEach(function(s){last+=s.data[n-1]});if(!spec.stacked)last=spec.series[0].data[n-1];
  el.innerHTML='<h3><span>'+spec.title+'</span><b class="num">'+fmt(last,spec.dec==null?1:spec.dec)+' '+spec.unit+'</b></h3><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+grid+paths+'<line class="hl" x1="0" x2="0" y1="0" y2="'+H+'" stroke="var(--muted)" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0"/></svg><div class="tip"></div><div class="row faint" style="justify-content:space-between;font-size:12px;margin-top:4px"><span>'+rangeLbl[range][0]+'</span><span>'+rangeLbl[range][1]+'</span></div>';
  var svg=$('svg',el),tip=$('.tip',el),hl=$('.hl',el);
  function mv(e){
    var rc=svg.getBoundingClientRect();var cx=(e.touches?e.touches[0].clientX:e.clientX);
    var f=Math.min(1,Math.max(0,(cx-rc.left)/rc.width));var i=Math.round(f*(n-1));
    hl.setAttribute('x1',f*W);hl.setAttribute('x2',f*W);hl.setAttribute('opacity','1');
    var rows=spec.series.map(function(s){return '<div><span class="swatch" style="background:'+s.color+';margin-right:6px"></span>'+s.name+' <b class="num">'+fmt(s.data[i],spec.dec==null?1:spec.dec)+' '+spec.unit+'</b></div>'}).join('');
    var ago=Math.round((1-i/(n-1))*({'1h':60,'24h':1440,'7d':10080,'30d':43200}[range]));
    var when=ago===0?'Now':ago<120?ago+' min ago':ago<2880?Math.round(ago/60)+' h ago':Math.round(ago/1440)+' days ago';
    tip.innerHTML='<div class="muted" style="margin-bottom:3px">'+when+'</div>'+rows;tip.classList.add('on');
    var tw=tip.offsetWidth,left=f*rc.width-tw/2;left=Math.max(0,Math.min(rc.width-tw,left));
    tip.style.left=left+'px';tip.style.top='34px';
  }
  function lv(){tip.classList.remove('on');hl.setAttribute('opacity','0')}

}

  return h;
}
function paintMsgs(){
  var m=$('#msgs');if(!m)return;
  var h='';
  if(!chatState.msgs.length)h='<div class="empty"><div class="big">Ask about this computer</div>I can read memory, health and settings. Changes need your approval first.</div>';
  chatState.msgs.forEach(function(x,i){
    if(x.k==='me')h+='<div class="bub me">'+esc(x.t)+'</div>';
    else if(x.k==='bot')h+='<div class="bub">'+x.t+'</div>';
    else if(x.k==='wake')h+='<div class="wake"><span class="dots"><i></i><i></i><i></i></span>Waking up. Loading the Helper model, a few seconds.</div>';
    else if(x.k==='think')h+='<div class="wake"><span class="dots"><i></i><i></i><i></i></span>Thinking</div>';
    else if(x.k==='tool'){
      h+='<div class="tool"><div class="tag">Proposed change</div><div style="margin-top:4px">'+x.title+'</div><div class="diff">'+x.diff+'</div>'+
      (x.status==='pending'?'<div class="row"><button class="btn primary sm press" data-tool="'+i+':ok">Approve</button><button class="btn sm press" data-tool="'+i+':no">Decline</button></div>':'<div class="muted" style="font-size:13px">'+(x.status==='ok'?'Approved. Done and logged as "by Helper, approved by admin".':'Declined. Nothing changed.')+'</div>')+'</div>';
    }
  });
  m.innerHTML=h;m.scrollTop=m.scrollHeight;
  var pct=Math.min(100,chatState.tokens/4096*100);$('#ctxbar').style.width=pct+'%';$('#ctxtxt').textContent=chatState.tokens+' of 4096';
  var d=$('#hp-dot'),s=$('#hp-st');if(d){d.className='dot'+(chatState.awake?'':' idle');s.textContent=chatState.waking?'Waking up':chatState.awake?'Awake. Sleeps after '+settings.helperIdle+' min idle':'Asleep'}
}
function reply(q){
  var l=q.toLowerCase();
  var push=function(o){chatState.msgs=chatState.msgs.filter(function(x){return x.k!=='think'});chatState.msgs.push(o);chatState.tokens+=Math.round(40+Math.random()*60);paintMsgs()};
  var p=pressure();
  if(l.indexOf('/new')===0){chatState.msgs=[];chatState.tokens=420;paintMsgs();return}
  if(l.indexOf('restart')>-1){var role=l.indexOf('chat')>-1?'chat':'image';
    push({k:'bot',t:'I can restart the '+role+' role. It will be offline for about 6 seconds. Approve it below.'});
    chatState.msgs.push({k:'tool',title:'Restart the '+role+' role',diff:'<div class="a">role: '+role+'</div><div style="color:var(--warn)">action: restart (about 6 s offline)</div>',status:'pending',role:role});paintMsgs();return}
  if(l.indexOf('memory')>-1||l.indexOf('tight')>-1||l.indexOf('why')>-1){
    push({k:'bot',t:'Memory is <b>'+p.t.toLowerCase()+'</b> right now: '+fmt(used()+other)+' GB of '+TOTAL+' GB in use. Chat takes '+fmt(roles[0].mem)+' GB, other programs take '+fmt(other)+' GB. The image role is asleep and needs 7.4 GB, so it can start but would make things tighter.'});
    chatState.msgs.push({k:'tool',title:'Shorten the image idle timer from 5 to 2 minutes',diff:'<div class="a">image.idle_minutes</div><div style="color:var(--bad)">- 5</div><div style="color:var(--ok)">+ 2</div>',status:'pending',role:'idle'});paintMsgs();return}
  if(l.indexOf('attention')>-1||l.indexOf('health')>-1){
    push({k:'bot',t:health.length?'Two things: a newer speech model is ready, and the models disk is 82 percent full. Open Health to fix each with one button.':'Nothing needs attention. Every role answered its last check.'});return}
  push({k:'bot',t:'I can read roles, health, memory, settings and updates, and propose changes for you to approve. Try "Why is memory tight?" or "Restart the image role".'});
}
function send(q){
  q=(q||'').trim();if(!q)return;
  chatState.msgs.push({k:'me',t:q});chatState.tokens+=Math.round(q.length/3);
  var go2=function(){chatState.msgs.push({k:'think'});paintMsgs();setTimeout(function(){reply(q)},900)};
  if(!chatState.awake){chatState.waking=true;chatState.msgs.push({k:'wake'});paintMsgs();
    setTimeout(function(){chatState.awake=true;chatState.waking=false;chatState.msgs=chatState.msgs.filter(function(x){return x.k!=='wake'});go2()},2600)}
  else go2();
}

/* ---------- live tick ---------- */
function tick(){
  roles.forEach(function(r){
    if(r.state==='ready'){r.mem=Math.max(.05,r.base*(1+rnd(-.015,.015))+(r.id==='chat'?rnd(-.1,.15):0));if(r.mem>r.peak)r.peak=r.mem;r.hist.push(r.mem)}
    else r.hist.push(0);
    if(r.hist.length>60)r.hist.shift();
  });
  other=Math.max(6,Math.min(13,other+rnd(-.15,.15)));
  swap=Math.max(.05,Math.min(.9,swap+rnd(-.03,.03)));
  cpu=Math.max(5,Math.min(70,cpu+rnd(-5,5)));gpu=Math.max(5,Math.min(95,gpu+rnd(-9,9)));
  tpsTotal=Math.max(8,Math.min(60,tpsTotal+rnd(-4,4)));
  roles[0].reqs+=Math.random()<.3?1:0;
  if(!booted)return;
  if(cur==='overview')liveOverview();
  liveResources();
  nowbar();
}
setInterval(tick,2000);

  if(a==='unload'){r.state='idle';r.mem=0;r.loaded='Unloaded just now';toast(r.name+' unloaded. It wakes on the next request.');closeSheet();paintNow()}
}

    return}
  if(e.key==='Escape')closeSheet();
  if(e.target.id==='chatin'&&e.key==='Enter'){var v=e.target.value;e.target.value='';$('#cmdmenu').classList.add('hidden');send(v)}
  if(e.target.id==='nowbar'&&e.key==='Enter')go('resources');
});

$('#signform').addEventListener('submit',function(e){
  e.preventDefault();
  $('#signin').classList.add('hidden');$('#app').classList.remove('hidden');$('#tabbar').classList.remove('hidden');$('#nowbar').classList.remove('hidden');
  buildNav();nowbar();render();
  setTimeout(function(){booted=true;render()},750);
});
var saved=store.get('stack-theme');if(saved==='light'||saved==='dark')themeSet(saved);
else if(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches&&false)themeSet('light');
buildNav();
})();
</script>
</body>
</html>
