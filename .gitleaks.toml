title = "MaiPai Stack gitleaks config"

[extend]
useDefault = true

[allowlist]
paths = [
  '''(^|/)node_modules(/|$)''',
  '''(^|/)data(/|$)''',
  '''(^|/)data-[^/]+(/|$)''',
  '''(^|/)frontend/dist(/|$)''',
  '''(^|/)docs/site/dist(/|$)''',
  '''(^|/)docs/site/\.astro(/|$)''',
  '''(^|/)dist(/|$)''',
  '''(^|/)desktop/src-tauri/target(/|$)''',
  '''(^|/)desktop/src-tauri/gen(/|$)''',
  '''(^|/)desktop/src-tauri/binaries/[^/]+$''',
]
