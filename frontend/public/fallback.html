<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MaiPai Stack</title>
    <style>
      :root { color-scheme: light dark; font: 16px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; background: #101010; color: #f5f5f5; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; } main { width: min(32rem, calc(100% - 3rem)); }
      h1 { font-size: 2rem; margin: 0 0 .5rem; } p { color: #b9b9b9; }
      button, a { display: inline-block; border: 1px solid #555; border-radius: .5rem; padding: .7rem 1rem; color: inherit; background: #222; font: inherit; text-decoration: none; cursor: pointer; }
      button { background: #f5f5f5; color: #101010; border-color: #f5f5f5; margin-right: .5rem; } #status { font-size: .875rem; }
    </style>
  </head>
  <body>
    <main><h1>The Stack is not running</h1><p>Start the Stack service, then this window will open the local console.</p><button id="start" type="button">Start</button><a href="https://docs.maipai.com/stack">Open the docs</a><p id="status">Checking the daemon…</p></main>
    <script>
      const daemon = "http://127.0.0.1:8770", status = document.querySelector("#status");
      async function check() { try { const response = await fetch(`${daemon}/healthz`); if (response.ok) location.href = daemon; else throw new Error(); } catch { status.textContent = "The daemon is offline."; } }
      document.querySelector("#start").addEventListener("click", async () => { status.textContent = "Starting…"; try { await window.__TAURI__.core.invoke("start_daemon"); } catch { status.textContent = "Start failed. Open the docs for service setup."; } setTimeout(check, 1000); });
      check(); setInterval(check, 3000);
    </script>
  </body>
</html>
