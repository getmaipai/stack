name: Site

on:
  push:
    paths:
      - "docs/site/**"
      - "docs/user/**"
      - "installer/install.sh"
      - "scripts/build-release.sh"
      - ".github/workflows/site.yml"
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - run: bun install --cwd docs/site
      - run: bun run build
        working-directory: docs/site
        env:
          MAIPAI_STACK_RELEASE_TAG: ${{ steps.release.outputs.tag }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
